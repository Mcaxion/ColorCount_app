# Builds the Android APK on GitHub's servers every time code is pushed.
# The finished APK appears under  Actions -> (latest run) -> Artifacts -> ColorCount-APK
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/lib/android || true
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git zip unzip autoconf automake libtool \
               pkg-config zlib1g-dev libncurses-dev libffi-dev libssl-dev cmake build-essential ccache
          for L in libtinfo libncurses; do
            [ -e /usr/lib/x86_64-linux-gnu/$L.so.5 ] || sudo ln -sf /usr/lib/x86_64-linux-gnu/$L.so.6 /usr/lib/x86_64-linux-gnu/$L.so.5
          done

      - name: Install Buildozer
        run: |
          python -m venv ~/bvenv
          ~/bvenv/bin/pip install -q --upgrade pip
          ~/bvenv/bin/pip install -q buildozer "cython==0.29.37" setuptools
          ~/bvenv/bin/buildozer --version

      - name: Cache Android SDK/NDK and compiled libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Build APK (first build ~40-60 min)
        run: |
          source ~/bvenv/bin/activate
          set -o pipefail
          yes | buildozer -v android debug 2>&1 | tee build.log

      - name: Name the APK
        run: cp bin/*.apk bin/ColorCount.apk && ls -la bin

      - name: Publish the APK as a GitHub Release (easy download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: ColorCount APK (build ${{ github.run_number }})
          body: |
            **Download `ColorCount.apk` below**, copy it to your Android phone and tap it to install.
            (Allow "Install unknown apps" when Android asks.)
          files: bin/ColorCount.apk
          make_latest: true

      - name: Also keep the APK on the apk-output branch
        run: |
          mkdir out && cp bin/ColorCount.apk out/ && cd out
          git init -q && git checkout -q -b apk-output
          git add ColorCount.apk
          git -c user.name=github-actions -c user.email=actions@github.com commit -q -m "APK from build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk-output

      - name: Upload APK as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColorCount-APK
          path: bin/ColorCount.apk

      - name: Save the build log to the build-log branch (if it failed)
        if: failure()
        run: |
          mkdir logout
          (tail -n 800 build.log 2>/dev/null || echo "build.log was not created") > logout/build-log.txt
          df -h / >> logout/build-log.txt
          cd logout && git init -q && git checkout -q -b build-log && git add .
          git -c user.name=github-actions -c user.email=actions@github.com commit -q -m "Build log of run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" build-log
